# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/tools/projmgr/2.12.0/tools/projmgr/schemas/cproject.schema.json
project:
  groups:
    - group: Camera app
      files:
        - file: main.c
        - file: camera/camera.c
        - file: power_management/power_management.c
        - file: camera/isp_calibration.c
        - file: camera/isp_calibration_ov5675.c

    - group: JPEG encoder
      files:
        - file: jpeg/jpeg.c

    - group: Support modules
      files:
        - file: ../libs/common_app_utils/logging/uart_tracelib.c
        - file: ../libs/common_app_utils/logging/retarget.c
        - file: ../libs/common_app_utils/fault_handler/fault_handler.c
        - file: leds/leds.c

  output:
    base-name: $Project$
    type:
      - elf
      - bin
      - map

  add-path:
    - .
    - ../libs/common_app_utils/logging
    - ../libs/common_app_utils/fault_handler
    - power_management
    - camera
    - leds

  layers:
    - layer: $BoardLayer$

  components:
    - component: ARM::CMSIS:CORE
    - component: AlifSemiconductor::Device:Startup
    - component: AlifSemiconductor::Device:SOC Peripherals:PINCONF
    - component: AlifSemiconductor::Device:SOC Peripherals:GPIO
    - component: AlifSemiconductor::CMSIS Driver:USART

    - component: AlifSemiconductor::Device:SOC Peripherals:MHU
    - component: AlifSemiconductor::Services:Secure Enclave:core&Source
    - component: AlifSemiconductor::Services:Secure Enclave:Initialization Helper&Source
    - component: BSP:External peripherals:CAMERA Sensor OV5675
    - component: CMSIS Driver:I2C
    - component: Device:SOC Peripherals:CPI
    - component: Device:SOC Peripherals:MIPI CSI2
    - component: Device:SOC Peripherals:MIPI DSI CSI2 DPHY
    - component: Device:SOC Peripherals:ISP
